name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Lint with flake8
      run: |
        # Para E9, F63, F7, F82
        flake8 src/ tests/ clipboard.py setup_autostart.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Verifica a complexidade (limite 10)
        flake8 src/ tests/ clipboard.py setup_autostart.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Run Unit Tests with xvfb (Virtual Display)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb \
          libxcb1 libx11-xcb1 libxcb-render0 libxcb-shm0 libxcb-xinerama0 \
          libxrandr2 libxrender1 libxkbcommon-x11-0 libgl1 libgl1-mesa-dri libglib2.0-0
        # xvfb-run simula um display no Ubuntu Server para os testes do PyQt
        xvfb-run -s "-screen 0 1920x1080x24" env QT_QPA_PLATFORM=offscreen pytest tests/ -v
